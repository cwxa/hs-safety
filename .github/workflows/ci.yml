name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and build tools
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: python -m ruff check hs_safety scripts tests
      - name: Check documentation links
        run: python scripts/check_links.py
      - name: Run offline tests
        run: python -m pytest -m "not integration" --strict-markers -q --junitxml=results/ci-tests.xml
      - name: Build distribution
        run: python -m build
