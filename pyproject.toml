[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-safety"
version = "0.1.0"
description = "Causal hidden-state streaming detection for final-response content safety"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Weixin Chen"}]
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.7", "transformers==4.51.3", "datasets==3.6.0",
  "scikit-learn==1.7.2", "safetensors==0.5.3", "accelerate==1.6.0",
  "huggingface-hub==0.30.2", "numpy>=1.26", "scipy>=1.11",
  "matplotlib>=3.8", "PyYAML==6.0.2", "requests>=2.32", "pandas>=2.2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "pymupdf>=1.25", "pypdf>=5"]

[project.scripts]
hs-safety = "hs_safety.__main__:main"

[project.urls]
Homepage = "https://github.com/cwxa/hs-safety"
Repository = "https://github.com/cwxa/hs-safety"
Issues = "https://github.com/cwxa/hs-safety/issues"

[tool.setuptools.packages.find]
include = ["hs_safety*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
