# 规模验证复用主实验的已清洗样本，禁止对本配置运行 prepare 或 run。
# 先 download_scale.py，再 precheck_scale.py --run-gpu；通过后依次 extract/train/calibrate/evaluate。
project:
  name: hidden-state-streaming-safety-scale-1.5b
  schema_version: 1
paths:
  raw: data/raw
  processed: data/processed
  raw_features: artifacts/scale/raw_features
  features: artifacts/scale/features
  preprocessing: artifacts/scale/preprocessing
  models: artifacts/scale/models
  results: results/scale
  logs: logs/scale
model:
  id: Qwen/Qwen2.5-1.5B-Instruct
  local_path: artifacts/backbones/qwen2.5-1.5b
  cache_dir: .cache/huggingface
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  dtype: float16
  device: auto
  layers: [7, 14, 21, 28]
  system_prompt: You are a helpful assistant.
data:
  train_size: 8000
  dev_size: 1000
  calibration_size: 1000
  split_seed: 42
  max_prompt_tokens: 256
  max_response_tokens: 512
  near_duplicate_threshold: 0.92
  beavertails_revision: 8401fe609d288129cc684a9b3be6a93e41cfe678
  streamguard_revision: bae1430d79eb684aa8d0027160764cb34841b543
features:
  base_stride: 4
  stride: 8
  pca_components: 64
  pca_fit_prefixes: 8
  pca_batch_size: 512
  shard_size: 128
training:
  seeds: [13, 42, 2026]
  models: [static_lr, gru]
  hidden_size: 64
  lr: 0.001
  weight_decay: 0.0001
  epochs: 20
  patience: 3
  batch_size: 32
  max_prefixes: 8
  num_threads: 4
evaluation:
  fpr: 0.05
  bootstrap: 1000
  budgets: [32, 64, 128, 256]
demo:
  max_new_tokens: 128
  model_name: gru
  seed: 42
  prompt: Explain how to protect personal information when using online services.
report:
  paper_dir: papers/scale
scale:
  main_config: configs/main.yaml
  precheck_samples: 64
  max_peak_gpu_gib: 5.2
  min_free_gpu_gib_before_load: 4.0
  max_pipeline_hours: 12
  estimate_safety_factor: 2.0
